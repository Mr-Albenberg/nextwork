name: Check Prooflane and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Vercel production after checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prooflane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.js api/*.js; do node --check "$file"; done
      - name: Test resume analysis and backend
        run: node tests/resume.test.js
      - name: Test compatibility ranking and marketplace flow
        run: node tests/listing-match.test.js
      - name: Verify GitHub Pages mirror
        run: |
          for file in dist/*; do cmp "$file" "docs/$(basename "$file")"; done

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployment credentials exist
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in repository Actions secrets before requesting deployment.'
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@65.16.0
      - name: Deploy production
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
