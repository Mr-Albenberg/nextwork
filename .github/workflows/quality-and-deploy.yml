name: Check Nextwork and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Vercel production after checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prooflane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: nextwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.js api/*.js lib/*.js; do node --check "$file"; done
      - name: Test resume analysis and backend
        run: node tests/resume.test.js
      - name: Test compatibility ranking and marketplace flow
        run: node tests/listing-match.test.js
      - name: Test profile setup, field criteria and grounded AI evidence
        run: node tests/profile-and-criteria.test.js
      - name: Test account isolation and sync
        run: node tests/account.test.js
      - name: Test database access policies and AI quotas
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140001_accounts.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/database.test.sql
      - name: Verify GitHub Pages mirror
        run: |
          for file in dist/*; do cmp "$file" "docs/$(basename "$file")"; done

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_IS0AaE5WZru2JKzDG5Riv3Gf
      VERCEL_PROJECT_ID: prj_XC0qJ2DbXKTw94LAlqo5P7KUKhuz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployment credentials exist
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Add VERCEL_TOKEN in repository Actions secrets before requesting deployment.'
            exit 1
          fi
      - name: Configure AI runtime and deploy through the Vercel project API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Owner explicitly confirmed completion of unbilled Free Tier setup in this session.
          GEMINI_FREE_TIER_CONFIRMED: 'true'
        run: node .github/scripts/vercel-deploy.cjs
