name: Check Nextwork (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: Run validation (GitHub Pages deploys on push)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prooflane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: nextwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image validation dependencies
        run: |
          npm ci --include=optional
          npm run prepare:photos
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.js api/*.js lib/*.js; do node --check "$file"; done
      - name: Test resume analysis and backend
        run: |
          node tests/resume.test.js
          node tests/resume-flow.test.js
          node tests/resume-editor.test.js
          node tests/account-resumes.test.js
          node tests/profile-import.test.js
          node tests/profile-import-client.test.js
      - name: Test applicant PDF report
        run: node tests/applicant-report.test.js
      - name: Test compatibility ranking and marketplace flow
        run: node tests/listing-match.test.js
      - name: Test profile setup, field criteria and grounded AI evidence
        run: node tests/profile-and-criteria.test.js
      - name: Test project recommendations, market data and API
        run: |
          node tests/recommend.test.js
          node tests/project-tracker.test.js
          node tests/project-files.test.js
      - name: Test profile photo validation and import
        run: |
          node tests/profile-photo.test.js
          node tests/photo-http.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase runtime compatibility
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/profile-photo/index.ts
          deno run --config supabase/functions/deno.json --allow-env=PHOTO_ALLOW_LOCALHOST tests/photo-http.test.mjs
      - name: Test account isolation and sync
        run: node tests/account.test.js
      - name: Test searchable catalogs
        run: node tests/search-catalogs.test.js
      - name: Test shared messaging client
        run: node tests/messaging.test.js
      - name: Test paper-money checkout
        run: node tests/paper-checkout.test.js
      - name: Test account workflows in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/nextwork-browser" --no-save --no-package-lock playwright@1.62.1
          python3 -m http.server 3000 --directory dist > "$RUNNER_TEMP/nextwork-browser-server.log" 2>&1 &
          account_server_pid=$!
          trap 'kill "$account_server_pid"' EXIT
          curl --retry-connrefused --retry 5 --retry-delay 1 --fail --silent http://localhost:3000/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/nextwork-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node tests/account-browser.cjs
          NODE_PATH="$RUNNER_TEMP/nextwork-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node tests/theme-browser.cjs
          NODE_PATH="$RUNNER_TEMP/nextwork-browser/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node tests/messaging-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextwork-ui-checks
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Test database access policies and AI quotas
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140001_accounts.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140003_account_updates.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/database.test.sql
      - name: Test organization permissions and applicant privacy
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140002_organizations.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/organizations.test.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/account-deletion.test.sql
      - name: Test immutable account types and role boundaries
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140004_account_types.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/account-types.test.sql
      - name: Test private shared conversations and file permissions
        env:
          PGPASSWORD: local-ci-only
        run: |
          createdb -h localhost -U postgres nextwork_chat
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f tests/messaging-database-bootstrap.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f supabase/migrations/202611140001_accounts.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f supabase/migrations/202611140002_organizations.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f supabase/migrations/202611140003_account_updates.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f supabase/migrations/202611140004_account_types.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f tests/messaging-storage-bootstrap.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f supabase/migrations/202611140005_messaging.sql
          psql -h localhost -U postgres -d nextwork_chat -v ON_ERROR_STOP=1 -f tests/messaging.test.sql
      - name: Test private profile photos
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/storage-bootstrap.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140005_messaging.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140006_profile_photos.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/profile-photos.test.sql
      - name: Test private account resumes and first profile values
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611140007_account_resumes.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/account-resumes.test.sql
      - name: Test private project file policies
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611150008_project_files.sql
          psql -h localhost -U postgres -d nextwork_test -v ON_ERROR_STOP=1 -f tests/project-files.test.sql
      - name: Verify GitHub Pages mirror
        run: |
          diff -qr --exclude=.nojekyll dist docs

  deploy-photos:
    name: Deploy photo backend to Supabase
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check deployment setup
        id: setup
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Photo backend not deployed: add SUPABASE_ACCESS_TOKEN in repository Actions secrets, apply migration 006, then rerun this workflow. No Vercel deployment is needed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.configured == 'true'
        with:
          node-version: '22'
      - name: Prepare pinned decoder
        if: steps.setup.outputs.configured == 'true'
        run: |
          npm ci --omit=dev
          npm run prepare:photos
      - uses: supabase/setup-cli@v1
        if: steps.setup.outputs.configured == 'true'
        with:
          version: 2.122.1
      - name: Confirm Docker bundling is available
        if: steps.setup.outputs.configured == 'true'
        run: docker info > /dev/null
      - name: Deploy validated photo function
        if: steps.setup.outputs.configured == 'true'
        run: supabase functions deploy profile-photo --project-ref zkoqafidgromlbvczwzy --use-docker

      - name: Configure private project file storage
        if: steps.setup.outputs.configured == 'true'
        run: node .github/scripts/provision-project-files.cjs
